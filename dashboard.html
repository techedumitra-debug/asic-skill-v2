<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Dashboard | ASIC-Skill</title>

  <link rel="stylesheet" href="auth.css">
</head>

<body onload="protectDashboard()">

  <main class="wrap">

    <div class="card">

      <h1>
        Welcome, <span id="user-name">Loading...</span>!
      </h1>

      <p>
        Signed in as:
        <strong id="user-email">Loading...</strong>
      </p>

      <p>Your ASIC-Skill account is active.</p>

      <h2>Learning Dashboard</h2>

      <p>
        Your ASIC/VLSI courses and learning progress
        will appear here.
      </p>

      <button type="button" onclick="signOut()">
        Log Out
      </button>

    </div>

  </main>

  <!-- Supabase -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <!-- Your Supabase URL + Publishable Key -->
  <script src="supabase-config.js"></script>

  <!-- Authentication functions -->
  <script src="auth.js"></script>

<script src="ui-neutral-labels.js?v=37.0.52"></script>
</body>
</html>
