<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | ASIC-Skill</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Reset Password</h1>
      <p>Enter a new password for your ASIC-Skill account.</p>
      <form id="reset-password-form">
        <label for="new-password">New password</label>
        <div class="password-wrapper">
          <input id="new-password" type="password" minlength="8" required autocomplete="new-password">
          <button type="button" class="password-eye" onclick="togglePassword('new-password', this)" aria-label="Show password" aria-pressed="false">
            <span class="eye-show" aria-hidden="true">◉</span>
          </button>
        </div>
        <label for="confirm-new-password">Confirm new password</label>
        <div class="password-wrapper">
          <input id="confirm-new-password" type="password" minlength="8" required autocomplete="new-password">
          <button type="button" class="password-eye" onclick="togglePassword('confirm-new-password', this)" aria-label="Show password" aria-pressed="false">
            <span class="eye-show" aria-hidden="true">◉</span>
          </button>
        </div>
        <button type="submit">Update Password →</button>
      </form>
      <div id="auth-message" class="auth-message" hidden></div>
      <p><a href="signin.html">Back to Sign In</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById("reset-password-form").addEventListener("submit", updatePassword);
  </script>
<script src="ui-neutral-labels.js?v=37.0.52"></script>
</body>
</html>
